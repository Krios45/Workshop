{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Workshop Management{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a class="brand" href="{% url 'dashboard:home' %}">Workshop Management</a>
            <nav class="nav">
                <a href="{% url 'dashboard:home' %}">Home</a>
                <a href="{% url 'dashboard:dashboard' %}">Dashboard</a>
                <a href="/admin/">Admin</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'accounts:profile' %}">Profile</a>
                    <form class="nav-inline" action="{% url 'accounts:logout' %}" method="post">
                        {% csrf_token %}
                        <button type="submit" class="link-button">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'accounts:login' %}">Login</a>
                    <a href="{% url 'accounts:signup' %}">Sign up</a>
                {% endif %}
            </nav>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
