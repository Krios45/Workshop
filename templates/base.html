{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Mini Asset/WMS{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
</head>
<body>
    <div class="orb orb-one"></div>
    <div class="orb orb-two"></div>
    <div class="particles" aria-hidden="true"></div>

    <header class="site-header glass">
        <a class="brand" href="{% url 'dashboard:home' %}">
            <span class="brand-mark">W</span>
            <span>Mini Asset/WMS</span>
        </a>
        <nav class="nav">
            <a href="{% url 'dashboard:home' %}">Trang chủ</a>
            <a href="{% url 'dashboard:dashboard' %}">Dashboard</a>
            <a href="{% url 'assets:list' %}">Thiết bị</a>
            <a href="{% url 'inventory:material_list' %}">Vật tư</a>
            <a href="{% url 'dashboard:analytics' %}">Thống kê</a>
        </nav>
        <div class="header-actions">
            {% if user.is_authenticated %}
                <a class="ghost-btn" href="{% url 'accounts:profile' %}">Hồ sơ</a>
                <form class="nav-inline" action="{% url 'accounts:logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit" class="ghost-btn">Đăng xuất</button>
                </form>
            {% else %}
                <a class="ghost-btn" href="{% url 'accounts:login' %}">Đăng nhập</a>
            {% endif %}
        </div>
    </header>

    {% block shell %}
    <main class="page-wrap">
        {% block content %}{% endblock %}
    </main>
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
