{% extends 'base.html' %}

{% block title %}Sign up | Workshop Management{% endblock %}

{% block content %}
<section class="panel">
	<h1>Create account</h1>
	<form method="post">
		{% csrf_token %}
		{{ form.as_p }}
		<button class="button" type="submit">Create account</button>
	</form>
	<p>
		Already have an account? <a href="{% url 'accounts:login' %}">Login</a>
	</p>
</section>
{% endblock %}
