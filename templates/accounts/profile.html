{% extends 'base.html' %}

{% block title %}Profile | Workshop Management{% endblock %}

{% block content %}
<section class="panel">
	<h1>Your profile</h1>
	<form method="post">
		{% csrf_token %}
		<h2>Account</h2>
		{{ user_form.as_p }}
		<h2>Profile</h2>
		{{ profile_form.as_p }}
		<button class="button" type="submit">Save changes</button>
	</form>
</section>
{% endblock %}
