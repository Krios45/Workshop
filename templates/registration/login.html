{% extends 'base.html' %}

{% block title %}Login | Workshop Management{% endblock %}

{% block content %}
<section class="panel">
	<h1>Login</h1>
	<form method="post">
		{% csrf_token %}
		{{ form.as_p }}
		<button class="button" type="submit">Login</button>
	</form>
	<p>
		No account? <a href="{% url 'accounts:signup' %}">Sign up</a>
	</p>
</section>
{% endblock %}
